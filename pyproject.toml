[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-support-system"
version = "0.1.0"
description = "Sistema de soporte automático para fintech — prueba técnica"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",   # cliente async para TestClient de FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Muestra output completo en caso de fallo
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "api*"]
